<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>미친 공튀기기</title>
<meta name="description" content="공을 튀겨 스테이지를 클리어하는 레트로 게임">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공튀기기">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#fff}
#gameContainer{position:relative;touch-action:none}
canvas{display:block;image-rendering:pixelated}
#overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);z-index:10;gap:12px}
#overlay.hidden{display:none}
.title{font-size:28px;font-weight:900;color:#ff4444;text-shadow:2px 2px #000,0 0 10px #ff0000}
.subtitle{font-size:14px;color:#aaa}
.info{font-size:16px;color:#ffd700}
.controls{font-size:11px;color:#666;text-align:center;line-height:1.6}
.btn{padding:12px 40px;font-size:18px;font-weight:bold;font-family:monospace;border:3px solid #ff4444;border-radius:0;cursor:pointer;background:#220000;color:#ff4444;transition:all 0.15s;-webkit-tap-highlight-color:transparent}
.btn:hover,.btn:active{background:#ff4444;color:#000}
#hud{position:absolute;top:4px;left:0;right:0;display:flex;justify-content:space-between;padding:2px 8px;pointer-events:none;font-size:12px;color:#fff;font-family:monospace;text-shadow:1px 1px #000;z-index:5}
#installBanner{display:none;position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(30,0,0,0.95);border:1px solid #ff4444;padding:10px 16px;z-index:100;gap:10px;align-items:center;font-size:13px;font-family:monospace;color:#ff4444}
#installBanner.show{display:flex}
#installBanner button{padding:6px 14px;border:1px solid #ff4444;background:none;color:#ff4444;font-family:monospace;cursor:pointer}
#installBanner .dismiss{border:none;font-size:16px}
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>
  <div id="hud">
    <span id="hudLevel">STAGE 1</span>
    <span id="hudDeaths">DEATHS: 0</span>
  </div>
  <div id="overlay">
    <div class="title">미친 공튀기기</div>
    <div class="subtitle">공을 튀겨 출구까지 도달하세요!</div>
    <div class="controls">
      ← → 방향키 / 터치 좌우<br>
      벽에 튀기며 출구(초록)로 이동
    </div>
    <button class="btn" id="startBtn">START</button>
  </div>
</div>
<div id="installBanner">
  <span>홈 화면에 추가</span>
  <button id="installBtn">설치</button>
  <button class="dismiss" id="installDismiss">&times;</button>
</div>
<script>
// PWA
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
let deferredPrompt;
const installBanner=document.getElementById('installBanner');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBanner.classList.add('show')});
document.getElementById('installBtn').addEventListener('click',()=>{if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;installBanner.classList.remove('show')})});
document.getElementById('installDismiss').addEventListener('click',()=>installBanner.classList.remove('show'));

const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const container=document.getElementById('gameContainer');
const overlay=document.getElementById('overlay');
const hudLevel=document.getElementById('hudLevel');
const hudDeaths=document.getElementById('hudDeaths');

const T=24; // tile size
const COLS=20;
const ROWS=26;
const W=COLS*T;
const H=ROWS*T;
canvas.width=W;
canvas.height=H;

function fitCanvas(){
  const s=Math.min(window.innerWidth/W, window.innerHeight/H, 2);
  canvas.style.width=(W*s)+'px';
  canvas.style.height=(H*s)+'px';
  container.style.width=(W*s)+'px';
  container.style.height=(H*s)+'px';
}
fitCanvas();
window.addEventListener('resize',fitCanvas);

  },

  {

      "2..................2",

      "2.......111.4......2",

      "2..................2",

      "2..4...............2",
      "2..................2",
      "2...........4......2",

      "2................E.2",

      "22222222222222222222",
    ]
  }

let state='menu';
let currentLevel=0;
let deaths=0;
let ball, tiles, spawnX, spawnY, exitX, exitY;
let keys={};
let touchDir=0;
let particles=[];
let shakeTimer=0;
let trailPositions=[];

function loadLevel(n) {
  const lv = LEVELS[n % LEVELS.length];
  tiles = [];
  for (let r = 0; r < ROWS; r++) {
    tiles[r] = [];
    const row = lv.map[r] || '';
    for (let c = 0; c < COLS; c++) {
      const ch = row[c] || '.';
      if (ch === 'S') { spawnX = c * T + T/2; spawnY = r * T + T/2; tiles[r][c] = 0; }
      else if (ch === 'E') { exitX = c; exitY = r; tiles[r][c] = 3; }
      else if (ch === '1') tiles[r][c] = 1;
      else if (ch === '2') tiles[r][c] = 2;
      else if (ch === '4') tiles[r][c] = 4;
      else if (ch === '5') tiles[r][c] = 5;
      else if (ch === '6') tiles[r][c] = 6;
      else tiles[r][c] = 0;
    }
  }
  resetBall();
  particles = [];
  trailPositions = [];
}

function resetBall() {
  ball = { x: spawnX, y: spawnY, vx: 0, vy: 0, r: 8, onGround: false, dead: false };
}

function spawnDeathParticles() {
  for (let i = 0; i < 20; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 4;
    particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2, life: 30+Math.random()*20, color: '#ff4444', size: 3+Math.random()*3 });
  }
}

function spawnExitParticles() {
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 3;
    particles.push({ x: ball.x, y: ball.y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 40+Math.random()*20, color: ['#00ff00','#44ff44','#88ff88','#ffff00'][Math.floor(Math.random()*4)], size: 2+Math.random()*4 });
  }
}

// Input
document.addEventListener('keydown', e => { keys[e.key]=true; if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key]=false; });
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) / rect.width;
  touchDir = tx < 0.4 ? -1 : tx > 0.6 ? 1 : 0;
  if (state === 'menu') { startGame(); }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const tx = (e.touches[0].clientX - rect.left) / rect.width;
  touchDir = tx < 0.4 ? -1 : tx > 0.6 ? 1 : 0;
}, { passive: false });
canvas.addEventListener('touchend', () => { touchDir = 0; });

document.getElementById('startBtn').addEventListener('click', startGame);

function startGame() {
  overlay.classList.add('hidden');
  currentLevel = 0;
  deaths = 0;
  loadLevel(currentLevel);
  state = 'playing';
  updateHUD();
}

function updateHUD() {
  hudLevel.textContent = 'STAGE ' + (currentLevel + 1);
  hudDeaths.textContent = 'DEATHS: ' + deaths;
}

function showOverlay(title, sub, btn) {
  overlay.classList.remove('hidden');
  overlay.innerHTML = `
    <div class="title">${title}</div>
    <div class="info">DEATHS: ${deaths}</div>
    <div class="subtitle">${sub}</div>
    <div class="controls">← → 방향키 / 터치 좌우</div>
    <button class="btn" onclick="document.getElementById('overlay').classList.add('hidden');state='playing'">${btn}</button>
  `;
  state = 'menu';
}

function getTile(px, py) {
  const c = Math.floor(px / T);
  const r = Math.floor(py / T);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return 2;
  return tiles[r][c];
}

function isSolid(t) { return t === 1 || t === 2; }

function update() {
  if (state !== 'playing') return;

  const gravity = 0.35;
  const moveSpeed = 0.5;
  const maxVx = 4;
  const friction = 0.88;
  const bounce = 0.65;

  // Input
  let inputX = 0;
  if (keys['ArrowLeft'] || keys['a']) inputX = -1;
  if (keys['ArrowRight'] || keys['d']) inputX = 1;
  if (touchDir !== 0) inputX = touchDir;

  ball.vx += inputX * moveSpeed;
  ball.vy += gravity;

  if (Math.abs(ball.vx) > maxVx) ball.vx = Math.sign(ball.vx) * maxVx;

  ball.vx *= friction;

  // Move X
  ball.x += ball.vx;
  // Collide X
  const r = ball.r;
  for (let side = -1; side <= 1; side += 2) {
    const checkX = ball.x + side * r;
    for (let dy = -r + 2; dy <= r - 2; dy += r - 2) {
      const t = getTile(checkX, ball.y + dy);
      if (isSolid(t)) {
        if (side === 1) ball.x = Math.floor(checkX / T) * T - r;
        else ball.x = Math.ceil(checkX / T) * T + r;
        ball.vx = -ball.vx * bounce;
        break;
      }
    }
  }

  // Move Y
  ball.y += ball.vy;
  ball.onGround = false;
  // Collide Y
  for (let side = -1; side <= 1; side += 2) {
    const checkY = ball.y + side * r;
    for (let dx = -r + 2; dx <= r - 2; dx += r - 2) {
      const t = getTile(ball.x + dx, checkY);
      if (isSolid(t)) {
        if (side === 1) {
          ball.y = Math.floor(checkY / T) * T - r;
          ball.onGround = true;
          ball.vy = -Math.abs(ball.vy) * bounce;
          if (Math.abs(ball.vy) < 1.5) ball.vy = 0;
        } else {
          ball.y = Math.ceil(checkY / T) * T + r;
          ball.vy = Math.abs(ball.vy) * bounce;
        }
        break;
      }
      // Bounce pad
      if (t === 5 && side === 1) {
        ball.y = Math.floor(checkY / T) * T - r;
        ball.vy = -12;
        for (let i = 0; i < 8; i++) {
          particles.push({ x: ball.x, y: ball.y + r, vx: (Math.random()-0.5)*4, vy: Math.random()*2, life: 15+Math.random()*10, color: '#ffff00', size: 2+Math.random()*2 });
        }
        break;
      }
    }
  }

  // Check spikes
  const ballTile = getTile(ball.x, ball.y);
  if (ballTile === 4) {
    ball.dead = true;
  }
  // Also check nearby spike tiles with ball radius
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const c = Math.floor(ball.x / T) + dx;
      const rr = Math.floor(ball.y / T) + dy;
      if (rr >= 0 && rr < ROWS && c >= 0 && c < COLS && tiles[rr][c] === 4) {
        const cx = c * T + T/2, cy = rr * T + T/2;
        const dist = Math.hypot(ball.x - cx, ball.y - cy);
        if (dist < r + T/2 - 4) {
          ball.dead = true;
        }
      }
    }
  }

  // Check exit
  if (ballTile === 3) {
    spawnExitParticles();
    currentLevel++;
    if (currentLevel >= LEVELS.length) {
      showOverlay('축하합니다!', '모든 스테이지 클리어!', 'RESTART');
      currentLevel = 0;
    } else {
      loadLevel(currentLevel);
      updateHUD();
    }
    return;
  }

  // Death
  if (ball.dead || ball.y > H + 50) {
    deaths++;
    spawnDeathParticles();
    shakeTimer = 12;
    resetBall();
    updateHUD();
  }

  // Trail
  trailPositions.unshift({ x: ball.x, y: ball.y });
  if (trailPositions.length > 8) trailPositions.pop();

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Shake
  if (shakeTimer > 0) shakeTimer--;
}

// Drawing
const stonePattern = (() => {
  const c = document.createElement('canvas');
  c.width = T; c.height = T;
  const x = c.getContext('2d');
  x.fillStyle = '#666';
  x.fillRect(0, 0, T, T);
  x.fillStyle = '#777';
  x.fillRect(1, 1, T-2, T/2-2);
  x.fillStyle = '#555';
  x.fillRect(1, T/2+1, T/2-2, T/2-2);
  x.fillStyle = '#5a5a5a';
  x.fillRect(T/2+1, T/2+1, T/2-2, T/2-2);
  x.strokeStyle = '#444';
  x.lineWidth = 1;
  x.strokeRect(0, 0, T, T);
  x.strokeRect(0, 0, T, T/2);
  x.strokeRect(0, T/2, T/2, T/2);
  return c;
})();

const brickPattern = (() => {
  const c = document.createElement('canvas');
  c.width = T; c.height = T;
  const x = c.getContext('2d');
  x.fillStyle = '#aa2222';
  x.fillRect(0, 0, T, T);
  x.fillStyle = '#cc3333';
  x.fillRect(1, 1, T-2, T/2-2);
  x.fillStyle = '#992222';
  x.fillRect(1, T/2+1, T/2-2, T/2-2);
  x.fillStyle = '#bb2828';
  x.fillRect(T/2+1, T/2+1, T/2-2, T/2-2);
  x.strokeStyle = '#661111';
  x.lineWidth = 1;
  x.strokeRect(0, 0, T, T);
  x.strokeRect(0, 0, T, T/2);
  x.strokeRect(0, T/2, T/2, T/2);
  return c;
})();

function draw() {
  const sx = shakeTimer > 0 ? (Math.random()-0.5)*6 : 0;
  const sy = shakeTimer > 0 ? (Math.random()-0.5)*6 : 0;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, W, H);

  // Tiles
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = tiles[r][c];
      const x = c * T, y = r * T;
      if (t === 1) {
        ctx.drawImage(stonePattern, x, y);
      } else if (t === 2) {
        ctx.drawImage(brickPattern, x, y);
      } else if (t === 3) {
        // Exit - pulsing green
        const pulse = 0.6 + 0.4 * Math.sin(Date.now() / 200);
        ctx.fillStyle = `rgba(0,255,0,${pulse})`;
        ctx.fillRect(x + 2, y + 2, T - 4, T - 4);
        ctx.strokeStyle = '#00ff00';
        ctx.lineWidth = 2;
        ctx.strokeRect(x + 2, y + 2, T - 4, T - 4);
        // Arrow
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('→', x + T/2, y + T/2);
      } else if (t === 4) {
        // Spikes
        ctx.fillStyle = '#ff4444';
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          const bx = x + i * (T/3);
          ctx.moveTo(bx, y + T);
          ctx.lineTo(bx + T/6, y + 4);
          ctx.lineTo(bx + T/3, y + T);
        }
        ctx.fill();
      } else if (t === 5) {
        // Bounce pad
        ctx.fillStyle = '#444';
        ctx.fillRect(x, y + T - 6, T, 6);
        ctx.fillStyle = '#ffff00';
        ctx.fillRect(x + 2, y + T - 5, T - 4, 4);
        // Spring coils
        ctx.strokeStyle = '#cccc00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + T/4, y + T - 6);
        ctx.lineTo(x + T/4, y + 4);
        ctx.moveTo(x + T*3/4, y + T - 6);
        ctx.lineTo(x + T*3/4, y + 4);
        ctx.stroke();
      }
    }
  }

  // Trail
  for (let i = 1; i < trailPositions.length; i++) {
    const p = trailPositions[i];
    const alpha = (1 - i / trailPositions.length) * 0.3;
    const size = ball.r * (1 - i / trailPositions.length);
    ctx.beginPath();
    ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.fill();
  }

  // Ball
  if (state === 'playing') {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#fff';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
    // Highlight
    ctx.beginPath();
    ctx.arc(ball.x - 2, ball.y - 2, ball.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 50;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // Touch hints
  if (state === 'playing' && touchDir !== 0) {
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#fff';
    if (touchDir === -1) ctx.fillRect(0, 0, W * 0.4, H);
    else ctx.fillRect(W * 0.6, 0, W * 0.4, H);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

loadLevel(0);
gameLoop();
</script>
</body>
